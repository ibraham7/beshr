services:
  - type: web
    name: beshr
    runtime: node
    plan: starter            # persistent disks need a paid plan
    buildCommand: echo "no build step"
    startCommand: node server.js
    healthCheckPath: /api/content
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false          # set in the Render dashboard (used on first start only)
    disk:
      name: beshr-data
      mountPath: /var/data
      sizeGB: 1
