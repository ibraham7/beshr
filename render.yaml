services:
  - type: web
    name: beshr
    runtime: node
    plan: free
    buildCommand: echo "no build step"
    startCommand: node server.js
    healthCheckPath: /api/content
    envVars:
      # Site content, admin password, messages and uploads live in Supabase,
      # so nothing is lost when the free instance restarts.
      - key: SUPABASE_URL
        value: https://jxhspeefkzsnvbunairn.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false          # secret key from Supabase → Project Settings → API Keys
      - key: ADMIN_PASSWORD
        sync: false          # used only the very first time, before a password is saved
