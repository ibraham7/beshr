<!doctype html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="theme-color" content="#0b2129">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:image" content="{{OG}}">
<link rel="icon" href="{{FAVICON}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Reem+Kufi:wght@400;500;600;700&family=Syne:wght@500;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style id="theme">{{THEME}}</style>
</head>
<body>
<div id="preloader" aria-hidden="true">
  <div class="pl-inner">
    <div class="pl-mark"><img id="plLogo" alt=""><img id="plLogoFill" alt=""></div>
    <div class="pl-count"><span id="plNum">0</span><i>%</i></div>
  </div>
  <div class="pl-curtain"></div>
</div>
<div id="progress"></div>
<div class="cursor" aria-hidden="true"><i class="c-dot"></i><i class="c-ring"><span></span></i></div>
<div class="grain" aria-hidden="true"></div>
<header id="header"></header>
<nav id="menu" aria-hidden="true"></nav>
<main id="app"></main>
<div id="lightbox" role="dialog" aria-modal="true" aria-hidden="true"></div>
<noscript><p style="padding:2rem;color:#fff">Please enable JavaScript.</p></noscript>
<script>window.__CONTENT__ = {{CONTENT}};</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js" defer></script>
<script src="/js/app.js" defer></script>
</body>
</html>
